name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Filament ${{ matrix.filament }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        filament: ['^4.0', '^5.0']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, pdo_sqlite, mbstring, intl
          coverage: none

      - name: Require Filament ${{ matrix.filament }}
        run: composer require "filament/filament:${{ matrix.filament }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction -W

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse

      - name: Pest
        run: vendor/bin/pest --parallel
